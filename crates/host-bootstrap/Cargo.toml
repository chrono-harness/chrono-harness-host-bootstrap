[package]
name = "chrono-host-bootstrap"
version = "0.1.6"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-host-bootstrap"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4"
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
sha2 = "0.11"
rustix = {version = "1", features = ["fs", "net"]}
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "=0.4.0"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
