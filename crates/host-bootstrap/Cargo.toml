[package]
name = "chrono-host-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-host-bootstrap"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-worktree = { git = "https://github.com/chrono-harness/chrono-harness-worktree.git", rev = "8d11cbf5385d838213911c4debbef4d336a0ca2c" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
