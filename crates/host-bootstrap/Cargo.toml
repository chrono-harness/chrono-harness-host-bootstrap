[package]
name = "chrono-host-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-host-bootstrap"
path = "src/main.rs"
test = false
bench = false

[dependencies]
sha2 = "0.10"
rustix = {version = "1", features = ["net"]}
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.2.0"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
