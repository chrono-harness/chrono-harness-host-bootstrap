[package]
name = "chrono-host-bootstrap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-host-bootstrap = { path = "../host-bootstrap" }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vstd = "=0.0.0-2026-11-22-0344"

[[bin]]
name = "chrono-test-bootstrap-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[[test]]
name = "bindings"
path = "tests/bindings.rs"

[[test]]
name = "registered_methods"
path = "tests/registered_methods.rs"

[[test]]
name = "compiler_query"
path = "tests/compiler_query.rs"

[[test]]
name = "report_query"
path = "tests/report_query.rs"

[dev-dependencies]
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
hex = "0.4"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }

[[test]]
name = "verified_bindings"
path = "tests/verified_bindings.rs"

[[test]]
name = "verified_cargo"
path = "tests/verified_cargo.rs"

[[test]]
name = "template"
path = "tests/template.rs"

[[test]]
name = "native_scratch"
path = "tests/native_scratch.rs"

[[example]]
name = "release_observation"
path = "tests/verified_bindings.rs"

[[test]]
name = "deployed_host"
path = "../../.chrono-harness/ci/host_adapters.rs"
