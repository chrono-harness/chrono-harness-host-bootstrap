[package]
name = "chrono-host-bootstrap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-host-bootstrap = { path = "../host-bootstrap" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "chrono-test-bootstrap-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[[test]]
name = "bindings"
path = "tests/bindings.rs"

[[test]]
name = "registered_methods"
path = "tests/registered_methods.rs"
